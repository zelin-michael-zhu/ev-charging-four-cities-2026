name: Mirror official raw source to draft release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Existing draft release ID (tag must match data/releases.json)
        required: true
        type: string
        default: "417197458"
      dry_run:
        description: Validate the plan only; do not download or upload
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: official-raw-source-mirror-${{ github.repository }}
  cancel-in-progress: false

jobs:
  mirror-raw:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manifest and bounded disk plan (no network)
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: python scripts/mirror_source_release.py --release-id "$RELEASE_ID" --dry-run
      - name: Mirror only raw parts; leave the release in draft
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: python scripts/mirror_source_release.py --release-id "$RELEASE_ID"
